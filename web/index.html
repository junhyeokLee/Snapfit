  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="사진과 이야기를 모아 나만의 앨범을 만들고 함께 간직하는 스냅핏.">
  <meta name="application-name" content="스냅핏">
  <meta name="theme-color" content="#F7F5F2">
  <meta name="color-scheme" content="light dark">
  <meta property="og:type" content="website">
  <meta property="og:title" content="스냅핏 · 나만의 사진 앨범">
  <meta property="og:description" content="사진과 이야기를 모아 나만의 앨범을 만들고 함께 간직하세요.">
  <meta property="og:locale" content="ko_KR">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="스냅핏">
  <link rel="apple-touch-icon" href="icons/snapfit-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon-snapfit.png">

  <title>스냅핏 · 나만의 사진 앨범</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
  
  
  
  
  <style id="snapfit-web-base-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--snapfit-web-background, #F7F5F2);
    }
  </style>
  <script id="snapfit-initial-web-theme">
    (() => {
      let mode = 'system';
      try {
        const saved = JSON.parse(localStorage.getItem('flutter.snapfit_web_theme_mode_v1'));
        if (saved === 'light' || saved === 'dark') mode = saved;
      } catch (_) { /* Storage may be unavailable; use the system preference. */ }
      const dark = mode === 'dark' || (mode === 'system' &&
        typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches);
      const background = dark ? '#111719' : '#F7F5F2';
      const root = document.documentElement;
      root.setAttribute('data-snapfit-theme', dark ? 'dark' : 'light');
      root.style.setProperty('color-scheme', dark ? 'dark' : 'light');
      root.style.setProperty('--snapfit-web-background', background);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', background);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async=""></script>
