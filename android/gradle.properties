# Leave room for Flutter, the editor and macOS on an 8 GB development machine.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon.idletimeout=600000
# Kotlin otherwise inherits the Gradle heap limit in a separate process.
kotlin.daemon.jvmargs=-Xmx1G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m
android.useAndroidX=true
android.enableJetifier=true
# These Flutter engine JARs contain native .so files, without Java classes.
# Skip rewriting hundreds of MB of binaries; legacy Java plugins still use Jetifier.
android.jetifier.ignorelist=(armeabi_v7a|arm64_v8a|x86_64)_(debug|profile|release)-.*[.]jar$
# Keep legacy Kotlin plugin mode until all Flutter plugins support built-in Kotlin.
android.builtInKotlin=false
# Keep the old DSL while Flutter plugins finish migrating to AGP 9.
android.newDsl=false
# flutter_inappwebview still supplies this legacy rule file with AGP 9.
android.r8.proguardAndroidTxt.disallowed=false
