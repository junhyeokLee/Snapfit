name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate generated Dart files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Analyze
        run: flutter analyze

      - name: Supabase code-only readiness audit
        run: python3 tool/supabase_readiness_check.py --skip-remote

      - name: Test
        run: flutter test
