name: Flutter CI

on:
  # ci.yml is the only automatic entry, preventing duplicate full test runs.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the shared pinned SDK versions
        id: sdk
        run: bash scripts/check_flutter_quality.sh sdk >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: bash scripts/check_flutter_quality.sh deps

      - name: Regenerate, verify formatting and check committed generated sources
        run: bash scripts/check_flutter_quality.sh generated

      - name: Analyze
        run: bash scripts/check_flutter_quality.sh analyze

      - name: Guard, Supabase code-only and template quality audits
        run: bash scripts/check_flutter_quality.sh audits

      - name: Test
        run: bash scripts/check_flutter_quality.sh test
