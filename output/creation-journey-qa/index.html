<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapFit 가입과 앨범 제작</title>
  <style>
    *{box-sizing:border-box;letter-spacing:0}
    body{margin:0;background:#f3f6f5;color:#222a2b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
    header{background:white;border-bottom:1px solid #e6ebea;padding:16px 24px}
    h1{margin:0 0 14px;font-size:20px;font-weight:600}
    .note{margin:12px 0 0;color:#63706e;max-width:840px;font-size:13px}
    nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    button,select{min-height:44px;background:white;border:1px solid #dce3e1;border-radius:6px;color:inherit;font:inherit;padding:8px 12px}
    button{width:44px;font-size:20px;cursor:pointer}
    button:focus-visible,select:focus-visible{outline:2px solid #08b8d0;outline-offset:2px}
    #viewport{margin-left:auto}
    main{padding:24px;display:flex;justify-content:center}
    figure{margin:0;width:390px;max-width:100%}
    figcaption{margin:0 0 12px;font-weight:600}
    img{display:block;width:100%;height:auto;background:white;border:1px solid #e6ebea}
    @media(max-width:500px){header,main{padding:16px}#viewport{margin-left:0}#screen{flex:1}}
  </style>
</head>
<body>
  <header>
    <h1>SnapFit 가입과 앨범 제작</h1>
    <nav aria-label="디자인 검토">
      <button type="button" id="previous" aria-label="이전 화면" title="이전 화면">&larr;</button>
      <select id="screen" aria-label="화면">
        <option value="home-empty">홈 · 첫 앨범 만들기</option>
        <option value="flow-start" selected>생성 · 디자인 선택</option>
        <option value="flow-preview">생성 · 템플릿 미리보기</option>
        <option value="flow-setup">생성 · 앨범 설정</option>
        <option value="flow-photos">생성 · 표지 사진 채우기</option>
        <option value="flow-photos-inner">생성 · 내지 사진 채우기</option>
        <option value="flow-cover">생성 · 표지 편집과 편집 진입</option>
        <option value="generating">AI · 생성 대기</option>
        <option value="failure">AI · 실패와 다시 시도</option>
        <option value="generating-dark">AI · 생성 대기 · 큰 글자 · 다크</option>
        <option value="failure-dark">AI · 실패 · 큰 글자 · 다크</option>
        <option value="login">로그인</option>
        <option value="signup">회원가입</option>
        <option value="signup-filled">회원가입 · 비밀번호 조건</option>
        <option value="signup-confirmation">가입 · 인증 메일 안내</option>
        <option value="email">이메일 로그인</option>
        <option value="reset">비밀번호 찾기</option>
        <option value="reset-sent">비밀번호 찾기 · 메일 안내</option>
        <option value="password-reset">새 비밀번호 설정</option>
        <option value="start">디자인 선택 · 구성 요소</option>
        <option value="setup">앨범 설정</option>
        <option value="brief">AI 디자인 요청</option>
        <option value="confirmation">AI 요청 확인</option>
        <option value="points">포인트 · AI 복귀 · 큰 글자</option>
        <option value="photos">사진 채우기</option>
        <option value="invite">초대 · 별도 구성 요소</option>
        <option value="consent">이용 동의 · 큰 글자 · 다크</option>
      </select>
      <button type="button" id="next" aria-label="다음 화면" title="다음 화면">&rarr;</button>
      <select id="viewport" aria-label="화면 크기">
        <option value="390">세로 390</option>
        <option value="320">작은 화면 320</option>
        <option value="844">가로 844</option>
      </select>
    </nav>
    <p class="note">홈에서 표지 확인까지 실제 앱 경로를 연결해 검토했습니다. 기존 앨범이 있는 홈, 리더, 페이지 편집은 유지합니다. 화면은 로컬 검증 데이터로 렌더링했으며 실제 저장·결제·AI 생성은 실행하지 않았습니다.</p>
    <p class="note">사진 채우기·표지 편집의 빈 사진 자리는 사용자 사진을 넣기 전 상태입니다. 템플릿 미리보기에서는 예시 사진이 포함된 원본 디자인을 볼 수 있습니다.</p>
  </header>
  <main>
    <figure id="figure">
      <figcaption id="caption">디자인 선택</figcaption>
      <img id="preview" src="flow-start-390-after.png" alt="디자인 선택 화면">
    </figure>
  </main>
  <script>
    const screen = document.getElementById('screen');
    const viewport = document.getElementById('viewport');
    const preview = document.getElementById('preview');
    function render(){
      const title = screen.selectedOptions[0].textContent;
      preview.src = `${screen.value}-${viewport.value}-after.png`;
      preview.alt = `${title} 화면`;
      document.getElementById('caption').textContent = title;
      document.getElementById('figure').style.width = `${viewport.value}px`;
    }
    document.getElementById('previous').addEventListener('click',()=>{
      screen.selectedIndex = (screen.selectedIndex + screen.options.length - 1) % screen.options.length;render();
    });
    document.getElementById('next').addEventListener('click',()=>{
      screen.selectedIndex = (screen.selectedIndex + 1) % screen.options.length;render();
    });
    screen.addEventListener('change',render);
    viewport.addEventListener('change',render);
    const initial = location.hash.slice(1);
    if ([...screen.options].some(option => option.value === initial)) screen.value = initial;
    render();
  </script>
</body>
</html>
