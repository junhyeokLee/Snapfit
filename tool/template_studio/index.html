<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SnapFit · Template Studio</title>
  <style>
    @font-face{font-family:StudioSans;src:url('../../assets/fonts/NotoSansKR-Regular.ttf') format('truetype');font-weight:400}
    @font-face{font-family:StudioSans;src:url('../../assets/fonts/NotoSansKR-Bold.ttf') format('truetype');font-weight:700}
    :root{font-family:StudioSans,Arial,sans-serif;color:#202521;background:#f7f8f6;font-synthesis:none;letter-spacing:0}
    *{box-sizing:border-box;letter-spacing:0}body{margin:0}button,a,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button:disabled{opacity:.28;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #238563;outline-offset:4px}button{border:0;background:none}button svg,a svg{width:20px;height:20px;stroke-width:1.7;flex-shrink:0}a{color:inherit;text-decoration:none}.hidden,[hidden]{display:none!important}
    .topbar{height:76px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 36px;border-bottom:1px solid #e4e8e1;gap:20px}.brand{display:flex;align-items:center;gap:16px}.brand strong{font-size:22px}.brand span{padding-left:16px;border-left:1px solid #dce0d8;font-size:12px;color:#656e66}.provenance{font-size:11px;color:#697269;display:flex;align-items:center;gap:8px}.provenance:before{content:'';width:6px;height:6px;background:#7d907e;border-radius:50%}
    main{max-width:1680px;margin:auto;padding:32px 36px 28px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{font-size:11px;color:#748073;margin:0 0 9px}h1{font-size:26px;font-weight:700;margin:0;line-height:1.4}.heading .count{font-size:12px;color:#70796f;padding-bottom:5px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:22px;flex-wrap:wrap}.segmented{display:flex;gap:4px;border:1px solid #dde3da;background:#fff;border-radius:6px;padding:4px}.segmented button{display:flex;gap:8px;align-items:center;justify-content:center;min-height:38px;padding:0 15px;border-radius:3px;font-size:12px;white-space:nowrap}.segmented button[aria-pressed=true]{background:#233b2f;color:white}.segmented svg{width:15px;height:15px}.right-tools{display:flex;align-items:center;gap:18px}.switch{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;min-height:44px}.switch input{accent-color:#234d3a;width:16px;height:16px}.icon{width:42px;height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #dde3da;border-radius:5px;background:#fff;flex-shrink:0}.icon:hover:not(:disabled){background:#eaf0e8}.text-button{display:flex;gap:8px;align-items:center;font-size:12px;min-height:44px}.text-button:hover{color:#14734c}.size{font-size:11px;color:#6d766b;white-space:nowrap}
    .overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}.study{min-width:0}.study-cover{background:#ecf0e9;width:100%;height:422px;display:flex;justify-content:center;align-items:center;padding:30px 26px;overflow:hidden;position:relative;border-radius:5px}.study:nth-child(2) .study-cover{background:#f1e9ea}.study:nth-child(3) .study-cover{background:#e8edf3}.study-cover img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 14px 10px #26322a20);transition:transform 240ms ease}.study-cover:hover img{transform:translateY(-4px)}.study-cover .open-hint{position:absolute;bottom:12px;right:12px;display:flex;padding:8px;background:#ffffffd9;border-radius:4px;opacity:0;transition:opacity .2s}.study-cover:hover .open-hint,.study-cover:focus-visible .open-hint{opacity:1}.open-hint svg{width:17px;height:17px}.study-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:18px}.study-number{font-size:10px;color:#737f70;margin-bottom:5px}.study h2{font-size:21px;margin:0;font-weight:700}.study p{font-size:12px;color:#747c72;margin:6px 0 18px}.mini-spread{padding:18px 0 4px;border-top:1px solid #dde3da}.spread{display:flex;align-items:stretch;justify-content:center;position:relative;min-width:0}.spread img{width:50%;height:auto;display:block;object-fit:contain}.spread:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#19251f24;pointer-events:none}.mini-spread button{padding:0;width:100%}.mini-meta{font-size:10px;color:#747c72;display:flex;justify-content:space-between;padding-top:10px}
    .workspace{display:grid;grid-template-columns:200px minmax(0,1fr);gap:26px}.directions{border-right:1px solid #dce2d8;padding-right:22px}.direction{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 9px;margin-bottom:7px;border-radius:5px;border:1px solid transparent;min-height:80px}.direction[aria-pressed=true]{background:#fff;border-color:#c1cebd}.direction img{width:42px;height:56px;object-fit:contain}.direction strong{display:block;font-size:12px}.direction span{display:block;font-size:10px;color:#737d70;margin-top:5px}.sidebar-bottom{margin-top:22px;padding-top:18px;border-top:1px solid #dce2d8}.sidebar-bottom p{font-size:11px;line-height:1.7;color:#6e786b;margin:0 0 14px}.viewer{min-width:0}.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px;padding-bottom:14px}.viewer-head h2{font-size:21px;margin:0}.viewer-head p{font-size:11px;color:#727d6e;margin:5px 0 0}.viewer-actions{display:flex;gap:8px}.stage{height:490px;min-height:260px;background:#eaf0e6;border-radius:5px;display:flex;align-items:center;justify-content:center;padding:30px 34px;position:relative;touch-action:pan-y;overflow:hidden}.book{max-width:100%;max-height:100%;display:flex;justify-content:center;position:relative;filter:drop-shadow(0 17px 11px #29372820)}.book img{height:100%;width:100%;min-width:0;object-fit:contain;display:block}.book.is-spread img{width:50%}.book.is-spread:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#23322438}.book.appear{animation:arrive 260ms ease-out}.pager{display:flex;justify-content:center;align-items:center;gap:22px;padding:18px 0}.pager output{font-size:12px;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}.pager .icon{border-radius:50%;width:42px;height:42px}.filmstrip{display:flex;gap:12px;justify-content:center;padding-top:4px}.thumb{width:140px;padding:8px;border:1px solid transparent;border-radius:5px}.thumb[aria-pressed=true]{border-color:#627a59;background:#f0f4ec}.thumb-preview{height:62px;display:flex;justify-content:center;align-items:center}.thumb-preview img{max-width:100%;max-height:100%;display:block}.thumb-preview .spread{height:100%;max-width:100%}.thumb-preview .spread img{height:100%;width:50%;object-fit:contain}.thumb span{display:block;font-size:10px;padding-top:7px;color:#6b7665}.bottomline{display:flex;justify-content:space-between;font-size:10px;color:#7b8577;margin-top:30px;padding-top:18px;border-top:1px solid #dde3da;gap:20px}
    dialog{border:0;border-radius:0;max-width:100vw;max-height:100dvh;width:100vw;height:100dvh;padding:0;background:#f3f5f0;color:#202521}dialog::backdrop{background:#f3f5f0}.zoom-head{height:70px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid #dde3da}.zoom-head strong{font-size:14px;max-width:42%}.zoom-mode{margin-left:auto;width:auto!important}.zoom-mode button{min-height:32px;padding:0 10px}.zoom-stage{height:calc(100dvh - 148px);display:flex;align-items:center;justify-content:center;padding:24px}.zoom-stage .book{filter:none}.zoom-pager{height:78px;padding:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:5px;background:#213c2c;color:#fff;font-size:12px;z-index:20;max-width:calc(100vw - 32px)}
    @keyframes arrive{from{opacity:.7;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    @media(min-width:1500px){.study-cover{height:480px}.stage{height:550px}}
    @media(max-width:1000px){.overview{gap:18px}.study-cover{height:340px;padding:22px 18px}.workspace{grid-template-columns:160px minmax(0,1fr);gap:18px}.directions{padding-right:12px}.direction{padding:10px 4px;gap:8px}.stage{height:410px;padding:22px}.size{display:none}main{padding:26px 24px}.topbar{padding:0 24px}.study h2{font-size:19px}}
    @media(max-width:700px){.topbar{height:62px;padding:0 18px}.brand{gap:10px}.brand strong{font-size:20px}.brand span{font-size:10px;padding-left:10px}.provenance{font-size:9px;max-width:92px;line-height:1.5}.provenance:before{display:none}main{padding:24px 16px}.heading{margin-bottom:20px;align-items:flex-start}h1{font-size:22px}.heading .count{font-size:10px;padding-top:30px;white-space:nowrap}.eyebrow{font-size:10px}.toolbar{gap:10px;padding-bottom:18px}.segmented{width:100%;justify-content:space-between}.segmented button{flex:1;padding:0 8px}.right-tools{justify-content:space-between;width:100%;gap:10px}.overview{grid-template-columns:1fr;gap:36px}.study-cover{height:390px;padding:24px}.study h2{font-size:22px}.mini-spread{padding-top:14px}.workspace{display:flex;flex-direction:column;gap:16px}.directions{border:0;padding:0;display:flex;gap:6px}.direction{padding:8px 6px;margin:0;flex:1;min-width:0;display:block;text-align:center;min-height:62px}.direction img,.direction span{display:none}.direction strong{font-size:11px;overflow-wrap:anywhere}.sidebar-bottom{display:none}.viewer-head h2{font-size:20px}.stage{height:360px;padding:18px 12px}.filmstrip{gap:6px}.thumb{width:calc((100% - 12px)/3);max-width:140px;padding:6px}.bottomline{line-height:1.8;margin-top:22px}.bottomline span:last-child{text-align:right}.zoom-head{height:62px;padding:10px 16px}.zoom-stage{height:calc(100dvh - 140px);padding:12px}.text-button{font-size:11px}.text-button svg{width:17px}}
    @media(max-height:520px) and (min-width:701px){.topbar{height:56px}main{padding-top:18px}.heading{margin-bottom:16px}.stage{height:330px}.study-cover{height:280px}}
    @media(max-width:700px){.stage{min-height:200px}.zoom-head strong{font-size:12px;word-break:keep-all;line-height:1.35}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><strong>snapfit</strong><span>TEMPLATE STUDIO</span></div><span class="provenance">제작 시안 · AI 생성 아님</span></header>
  <main>
    <div class="heading"><div><p class="eyebrow">CREATIVE STUDY / JEJU, SUMMER 2026</p><h1>제주, 세 가지 기록</h1></div><span class="count">03 DIRECTIONS</span></div>
    <div class="toolbar">
      <div id="aspects" class="segmented" role="group" aria-label="앨범 규격"></div>
      <div class="right-tools"><span id="size" class="size"></span><label class="switch"><input id="photos" type="checkbox" checked>샘플 사진</label><button id="overviewButton" class="text-button" hidden><i data-lucide="layout-grid"></i>전체 비교</button></div>
    </div>
    <section id="overview" class="overview" aria-label="디자인 비교"></section>
    <section id="workspace" class="workspace" hidden>
      <aside><div id="directions" class="directions"></div><div class="sidebar-bottom"><p>표지 + 내지 4쪽<br>샘플 컬렉션</p><a id="document" class="text-button" download><i data-lucide="download"></i>디자인 원본</a></div></aside>
      <div class="viewer">
        <div class="viewer-head"><div><h2 id="title"></h2><p id="label"></p></div><div class="viewer-actions"><button id="favorite" class="icon" title="선호 시안 저장" aria-label="선호 시안 저장" aria-pressed="false"><i data-lucide="bookmark"></i></button><button id="zoom" class="icon" title="크게 보기" aria-label="크게 보기"><i data-lucide="maximize-2"></i></button></div></div>
        <div id="stage" class="stage"><div id="book" class="book"></div></div>
        <div class="pager"><button id="previous" class="icon" aria-label="이전 스프레드" title="이전 스프레드"><i data-lucide="chevron-left"></i></button><output id="pageLabel" aria-live="polite"></output><button id="next" class="icon" aria-label="다음 스프레드" title="다음 스프레드"><i data-lucide="chevron-right"></i></button></div>
        <nav id="filmstrip" class="filmstrip" aria-label="페이지 목록"></nav>
      </div>
    </section>
    <footer class="bottomline"><span>SNAPFIT / DESIGN REVIEW</span><span>표지 + 대표 스프레드 2개<br>인쇄·소재 권리 검수 전</span></footer>
  </main>
  <dialog id="zoomDialog" aria-label="앨범 확대 보기"><div class="zoom-head"><strong id="zoomTitle"></strong><div class="segmented zoom-mode" role="group" aria-label="확대 보기 방식"><button id="zoomSingle" aria-pressed="false">한 쪽</button><button id="zoomSpread" aria-pressed="true">펼침</button></div><button id="closeZoom" class="icon" aria-label="확대 닫기" title="확대 닫기"><i data-lucide="x"></i></button></div><div id="zoomStage" class="zoom-stage"><div id="zoomBook" class="book"></div></div><div class="pager zoom-pager"><button id="zoomPrevious" class="icon" aria-label="확대 이전 페이지"><i data-lucide="chevron-left"></i></button><output id="zoomLabel"></output><button id="zoomNext" class="icon" aria-label="확대 다음 페이지"><i data-lucide="chevron-right"></i></button></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="catalog.js"></script><script src="lucide.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const names = ['표지', '1–2쪽', '3–4쪽'];
    const state = {direction: 'island', aspect: 'square', photos: true, page: 0, overview: true};
    const zoomState = {single: false, page: 0};
    const backgrounds = {island:'#eaf0e6',dear:'#f1e7e9',offduty:'#e8edf5'};
    let favorite = null;
    try { favorite = JSON.parse(localStorage.getItem('snapfit-studio-favorite')); } catch {}
    const icon = name => `<i data-lucide="${name}"></i>`;
    const image = (id, page, cls='') => `<img class="${cls}" data-page-index="${page}" src="renders/${id}_${state.aspect}_${state.photos?'photo':'empty'}_${page}.png" alt="${STUDIO.directions.find(d=>d.id===id).name} ${page===0?'표지':page+'쪽'}" draggable="false">`;
    const spread = (id, page) => `<div class="spread">${image(id,page)}${image(id,page+1)}</div>`;
    const icons = () => window.lucide?.createIcons();
    function aspectInfo(){ return STUDIO.aspects.find(a=>a.id===state.aspect); }
    function fitBook(book, stage, count=state.page===0?1:2){
      const a = aspectInfo(), ratio = a.width/a.height * count;
      const css = getComputedStyle(stage), availableWidth=stage.clientWidth-parseFloat(css.paddingLeft)-parseFloat(css.paddingRight), availableHeight=stage.clientHeight-parseFloat(css.paddingTop)-parseFloat(css.paddingBottom);
      const width = Math.min(availableWidth,availableHeight*ratio);
      book.style.width=width+'px'; book.style.height=(width/ratio)+'px';
    }
    function renderBook(){
      const a=aspectInfo(),ratio=a.width/a.height*(state.page===0?1:2);
      $('stage').style.height=innerWidth<=700?Math.min(420,Math.max(200,($('stage').clientWidth-24)/ratio+36))+'px':'';
      const content = state.page===0 ? image(state.direction,0) : image(state.direction,state.page*2-1)+image(state.direction,state.page*2);
      $('book').innerHTML=content; $('book').classList.toggle('is-spread',state.page>0);
      const zoomContent=zoomState.single?image(state.direction,zoomState.page):content;
      $('zoomBook').innerHTML=zoomContent; $('zoomBook').classList.toggle('is-spread',!zoomState.single&&state.page>0);
      fitBook($('book'),$('stage'));
      if($('zoomDialog').open) fitBook($('zoomBook'),$('zoomStage'),zoomState.single||state.page===0?1:2);
      $('pageLabel').textContent=names[state.page]; $('zoomLabel').textContent=zoomState.single?(zoomState.page===0?'표지':zoomState.page+'쪽'):names[state.page];
      $('previous').disabled=state.page===0; $('next').disabled=state.page===2;
      $('zoomPrevious').disabled=zoomState.single?zoomState.page===0:state.page===0;
      $('zoomNext').disabled=zoomState.single?zoomState.page===4:state.page===2;
      $('zoomSingle').setAttribute('aria-pressed',zoomState.single); $('zoomSpread').setAttribute('aria-pressed',!zoomState.single);
      $('filmstrip').querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===state.page));
    }
    function render(){
      $('aspects').innerHTML=STUDIO.aspects.map(a=>`<button data-aspect="${a.id}" aria-pressed="${state.aspect===a.id}">${icon(a.id==='portrait'?'rectangle-vertical':a.id==='square'?'square':'rectangle-horizontal')}${a.name}</button>`).join('');
      const a=aspectInfo(); $('size').textContent=`${a.width} × ${a.height} cm`;
      $('overview').hidden=!state.overview; $('workspace').hidden=state.overview; $('overviewButton').hidden=state.overview;
      $('overview').innerHTML=STUDIO.directions.map((d,i)=>`<article class="study"><button class="study-cover" data-open="${d.id}" aria-label="${d.name} 시안 보기">${image(d.id,0)}<span class="open-hint">${icon('arrow-up-right')}</span></button><div class="study-head"><div><div class="study-number">DIRECTION 0${i+1}</div><h2>${d.name}</h2></div><button class="icon" data-open="${d.id}" aria-label="${d.name} 펼쳐 보기" title="펼쳐 보기">${icon('arrow-up-right')}</button></div><p>${d.label}</p><div class="mini-spread"><button data-open="${d.id}" data-page="1" aria-label="${d.name} 1–2쪽 보기">${spread(d.id,1)}</button><div class="mini-meta"><span>OPENING SPREAD</span><span>01–02</span></div></div></article>`).join('');
      $('directions').innerHTML=STUDIO.directions.map((d,i)=>`<button class="direction" data-direction="${d.id}" aria-pressed="${state.direction===d.id}">${image(d.id,0)}<div><strong>${d.name}</strong><span>DIRECTION 0${i+1}</span></div></button>`).join('');
      const d=STUDIO.directions.find(d=>d.id===state.direction);
      $('title').textContent=d.name; $('label').textContent=d.label; $('zoomTitle').textContent=d.name+' / '+a.name;
      $('stage').style.background=backgrounds[d.id];
      $('document').href=`documents/${d.id}_${a.id}.json`;
      $('favorite').setAttribute('aria-pressed',favorite?.direction===state.direction && favorite?.aspect===state.aspect);
      $('favorite').style.background=$('favorite').getAttribute('aria-pressed')==='true'?'#d9e9cc':'#fff';
      $('filmstrip').innerHTML=names.map((name,i)=>`<button class="thumb" data-page="${i}" aria-pressed="${state.page===i}"><div class="thumb-preview">${i===0?image(d.id,0):spread(d.id,i*2-1)}</div><span>${name}</span></button>`).join('');
      renderBook(); icons();
    }
    function selectPage(page){ state.page=Math.max(0,Math.min(2,page)); zoomState.page=state.page===0?0:state.page*2-1;renderBook(); $('book').classList.remove('appear'); void $('book').offsetWidth; $('book').classList.add('appear'); }
    function zoomTurn(delta){if(!zoomState.single){selectPage(state.page+delta);return;}zoomState.page=Math.max(0,Math.min(4,zoomState.page+delta));state.page=Math.ceil(zoomState.page/2);renderBook();}
    document.addEventListener('click',event=>{
      const aspect=event.target.closest('[data-aspect]'); if(aspect){state.aspect=aspect.dataset.aspect;render();return;}
      const open=event.target.closest('[data-open]'); if(open){state.direction=open.dataset.open;state.page=Number(open.dataset.page||0);state.overview=false;render();window.scrollTo({top:0,behavior:'instant'});return;}
      const direction=event.target.closest('[data-direction]'); if(direction){state.direction=direction.dataset.direction;render();return;}
      const page=event.target.closest('.thumb[data-page]'); if(page)selectPage(Number(page.dataset.page));
    });
    $('photos').addEventListener('change',e=>{state.photos=e.target.checked;render();});
    $('overviewButton').onclick=()=>{state.overview=true;render();};
    $('previous').onclick=()=>selectPage(state.page-1); $('next').onclick=()=>selectPage(state.page+1);
    $('zoomPrevious').onclick=()=>zoomTurn(-1); $('zoomNext').onclick=()=>zoomTurn(1);
    $('zoom').onclick=()=>{zoomState.single=innerWidth<=700;zoomState.page=state.page===0?0:state.page*2-1;$('zoomDialog').showModal();renderBook();};
    $('zoomSingle').onclick=()=>{zoomState.single=true;renderBook();};
    $('zoomSpread').onclick=()=>{zoomState.single=false;renderBook();};
    $('closeZoom').onclick=()=>$('zoomDialog').close();
    let timer;
    $('favorite').onclick=()=>{
      const selected=favorite?.direction===state.direction&&favorite?.aspect===state.aspect;
      favorite=selected?null:{direction:state.direction,aspect:state.aspect};
      let persisted=true;try{localStorage.setItem('snapfit-studio-favorite',JSON.stringify(favorite));}catch{persisted=false;}
      $('toast').textContent=selected?'선호 시안을 해제했어요':persisted?'이 브라우저에 선호 시안을 저장했어요':'이번 화면에서 선호 시안을 선택했어요';
      $('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2200);render();
    };
    window.addEventListener('keydown',e=>{if(state.overview)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const delta=e.key==='ArrowRight'?1:-1;if($('zoomDialog').open)zoomTurn(delta);else selectPage(state.page+delta);}});
    let down=null;
    $('stage').addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};});
    $('stage').addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.5)selectPage(state.page+(dx<0?1:-1));});
    $('stage').addEventListener('pointercancel',()=>down=null);
    new ResizeObserver(()=>{if(!state.overview)renderBook();}).observe($('stage'));
    window.addEventListener('resize',()=>{if($('zoomDialog').open)fitBook($('zoomBook'),$('zoomStage'),zoomState.single||state.page===0?1:2);});
    render();
  </script>
</body>
</html>
